kafka.aggregator.bootstrap-servers=localhost:9092
kafka.aggregator.sensor-topic=telemetry.sensors.v1
kafka.aggregator.snapshot-topic=telemetry.snapshots.v1

kafka.aggregator.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
kafka.aggregator.producer.value-serializer=ru.yandex.practicum.kafka.serializer.GeneralAvroSerializer

kafka.aggregator.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
kafka.aggregator.consumer.value-deserializer=ru.yandex.practicum.kafka.serializer.SensorEventDeserializer
kafka.aggregator.consumer.group-id=aggregator-group
kafka.aggregator.consumer.client-id=consumer-1

kafka.aggregator.consumer.properties.fetch.min.bytes=1
kafka.aggregator.consumer.properties.max.poll.records=100
kafka.aggregator.consumer.properties.enable.auto.commit=false
kafka.aggregator.consumer.properties.fetch.max.wait.ms=1000
kafka.aggregator.consumer.properties.max.partition.fetch.bytes=1048576